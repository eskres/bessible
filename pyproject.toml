[project]
name = "bessible"
version = "0.1.0"
description = "BESS location assessment agent"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Einar Skreslett" },
    { name = "Jonathan Shaw" },
    { name = "Jack Swerdlow" },
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "cachecontrol>=0.14.4",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-ai-slim[anthropic,google,logfire,openai,temporal,typesafe]>=2.46.0",
    "pydantic-settings>=2.15.0",
    "shapely>=2.1.2",
    "temporalio>=1.33.0",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
# The classifier's Modal backend. Optional: without it the app starts and classifies with the llm backend.
modal = ["modal>=1.5.5"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

# Pylance / pyright (the editor's checker). mypy with the pydantic plugin stays the source of truth.
[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["src", "scripts", "tests"]
# Pydantic models narrow inherited fields on purpose (e.g. `dataset: Literal["green-belt"]`).
reportIncompatibleVariableOverride = false

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["src"]
# Tests assert on parsed fixtures: Optional fields are read without None checks, models built by field name.
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalOperand = false
reportOptionalIterable = false
reportOperatorIssue = false
reportArgumentType = false
reportAttributeAccessIssue = false
reportCallIssue = false

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["src"]

[dependency-groups]
dev = [
    "bessible[modal]",  # plain `uv sync` keeps Modal for local work; a VM installs with `uv sync --no-dev`
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pyproj>=3.8.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-shapely>=2.1.0.20260728",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "missing-trailing-comma",
    "missing-copyright-notice",
    "docstring-missing-returns",
    "docstring-missing-exception",
    "no-self-use",
    "non-empty-init-module",
    "non-imperative-mood",
]

[tool.ruff.lint.per-file-ignores]
# The checks are small class-in, class-out functions whose names say what they do.
"src/bessible/possibility/hard.py" = ["undocumented-public-function"]
"src/bessible/possibility/policy.py" = ["undocumented-public-function"]
"src/bessible/possibility/pipeline.py" = ["undocumented-public-function"]
# A command-line script: prints, runs top to bottom, holds the map's JavaScript and UI text (en dashes intended).
"scripts/site_report.py" = [
    "print",
    "implicit-namespace-package",
    "any-type",
    "complex-structure",
    "too-many-statements",
    "too-many-locals",
    "too-many-branches",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-statements-in-try-clause",
    "line-too-long",
    "ambiguous-unicode-character-string",
]
"scripts/news_research.py" = ["print", "implicit-namespace-package"]  # a command-line script
"test_*" = [
    "ANN",
    "D",
    "PLC",
    "PLR",
    "S",
    "ASYNC",
    "line-too-long",
    "float-equality-comparison",
    "complex-structure",
    "implicit-namespace-package",
    "raise-vanilla-args",
    "raw-string-in-exception",
    "magic-value-comparison",
    "unused-async",
    "boolean-positional-value-in-call",
]
"tests/*" = [
    "ANN",
    "D",
    "PLC",
    "PLR",
    "S",
    "ASYNC",
    "line-too-long",
    "float-equality-comparison",
    "complex-structure",
    "implicit-namespace-package",
    "raise-vanilla-args",
    "raw-string-in-exception",
    "magic-value-comparison",
    "unused-async",
    "boolean-positional-value-in-call",
]
"src/bessible/activities.py" = ["TC"]
"src/bessible/workflow.py" = ["TC", "PLR0914", "RUF012"]
"src/bessible/suitability/*" = [
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "C901",
    "BLE001",
    "TRY",
    "S110",
    "E501",
    "TC",
    "ERA001",
    "PERF401",
    "ARG001",
    "ASYNC",
    "SIM",
]
"src/bessible/stages/*" = [
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "C901",
    "BLE001",
    "TRY300",
    "TRY301",
    "S110",
    "E501",
    "TC",
    "ERA001",
    "PERF401",
    "ARG001",
    "ASYNC",
    "SIM",
    "RUF001",
]

[tool.ruff.lint.flake8-type-checking]
# Ruff does not follow inheritance across modules, so our pydantic base classes are listed too.
exempt-modules = [
    "bessible.api.base",
    "bessible.api.opendatasoft",
    "bessible.api.ckan",
    "bessible.api.ssen",
    "bessible.api.ukpn",
    "bessible.models",
    "bessible.suitability.assumptions",
]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "bessible.api.base.ApiRequest",
    "bessible.api.base.ApiResponse",
    "bessible.api.base.NullMarkerResponse",
    "bessible.api.opendatasoft.RecordsRequest",
    "bessible.api.opendatasoft.RecordsResponse",
    "bessible.api.ckan.CkanResponse",
    "bessible.api.ckan.DatastoreSearchRequest",
    "bessible.api.ckan.DatastoreSearchSqlRequest",
    "bessible.api.ckan.PackageSearchRequest",
    "bessible.api.ckan.PackageShowRequest",
    "bessible.api.nged._Record",
    "bessible.api.ssen_distribution._Record",
    "bessible.api.planning_data.EntityBase",
    "bessible.models.StageInput",
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
